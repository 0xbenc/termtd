name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Vet and test
        shell: bash
        run: go vet ./... && go test ./...
      - name: Test release replay
        run: python -m unittest discover -s packaging/tty -p 'test_*.py'
      - name: Test Homebrew formula renderer
        run: python -m unittest discover -s packaging/homebrew -p 'test_*.py'
      - name: Test itch packaging and launchers
        run: python -m unittest discover -s packaging/itch -p 'test_*.py'

  package:
    name: Build test downloads
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build snapshot packages
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --snapshot --clean --skip=sbom
      - name: Package Play launchers
        run: python3 packaging/itch/stage.py --zip
      - name: Windows test downloads
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-test-downloads
          path: dist/itch/windows-*.zip
          if-no-files-found: error
          retention-days: 7
      # Upload ZIPs directly to preserve app/script execute bits on download.
      - name: Mac test download (Apple Silicon)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/itch/mac-arm64.zip
          archive: false
          if-no-files-found: error
          retention-days: 7
      - name: Mac test download (Intel)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/itch/mac-amd64.zip
          archive: false
          if-no-files-found: error
          retention-days: 7
